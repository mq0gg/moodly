services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-moodly}
      POSTGRES_USER: ${DATABASE_USERNAME:-moodly}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-moodly}
    volumes:
      - moodly_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-moodly}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      # `develop` for local work (hot reload via the bind mount below);
      # switch to the default multi-stage build for a production image.
      target: base
    command: sh -c "npm install && npm run develop"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_HOST: db
    volumes:
      - ./backend:/opt/app
      - /opt/app/node_modules
    ports:
      - "1337:1337"
    depends_on:
      db:
        condition: service_healthy

volumes:
  moodly_db_data:
